name: Filtreleri güncelle ve yayınla

# Her gün EasyList / EasyPrivacy / AdGuard listelerini indirip Kalkan biçimine çevirir,
# destek sayfalarıyla birlikte GitHub Pages'e yayınlar. Uygulama /filters/manifest.json'u okur.
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listeleri çevir
        run: |
          mkdir -p _site/filters
          python3 scripts/convert_filters.py _site/filters
      - name: Sayfaları ekle
        run: cp index.html privacy.html style.css .nojekyll _site/ && cp filters/kalkan.txt _site/filters/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
